<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><title>Horizontal robot arm gravity lever arms</title><desc>Joint positions and mass centers come from the supplied horizontal configuration. Gravity acts down at each mass center and at the tip payload. Torque at the shoulder uses horizontal offsets from the base.</desc><rect width="1200" height="650" fill="#f1f5f2"/><g font-family="sans-serif" fill="#14363f"><text x="55" y="65" font-size="34">Gravity torque starts with a horizontal lever</text><text x="55" y="110" font-size="21">Two uniform links, vertical plane. Static educational model.</text><path d="M100 270 L460 270" stroke="#087e8b" stroke-width="18"/><path d="M460 270 L700 270" stroke="#bc4b16" stroke-width="18"/><circle cx="100" cy="270" r="13" fill="#14363f"/><text x="90" y="225" font-size="24">J1</text><circle cx="460" cy="270" r="13" fill="#14363f"/><text x="450" y="225" font-size="24">J2</text><circle cx="700" cy="270" r="13" fill="#14363f"/><text x="690" y="225" font-size="24">Tip</text><circle cx="280" cy="270" r="8" fill="#c25724"/><path d="M280 290V385 l-7 -14 m7 14 l7 -14" stroke="#c25724" fill="none" stroke-width="4"/><text x="255" y="435" font-size="21">1 kg</text><text x="255" y="470" font-size="19">x=0.15 m</text><circle cx="580" cy="270" r="8" fill="#c25724"/><path d="M580 290V385 l-7 -14 m7 14 l7 -14" stroke="#c25724" fill="none" stroke-width="4"/><text x="555" y="435" font-size="21">0.5 kg</text><text x="555" y="470" font-size="19">x=0.40 m</text><circle cx="700" cy="270" r="8" fill="#c25724"/><path d="M700 290V385 l-7 -14 m7 14 l7 -14" stroke="#c25724" fill="none" stroke-width="4"/><text x="675" y="435" font-size="21">0.4 kg</text><text x="675" y="470" font-size="19">x=0.50 m</text><text x="55" y="555" font-size="23">Shoulder: 9.81 × (1 × 0.15 + 0.5 × 0.40 + 0.4 × 0.50)</text><text x="55" y="600" font-size="27">Holding torque = 5.3955 N m</text></g></svg>