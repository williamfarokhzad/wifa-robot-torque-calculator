<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750"><title>Signed static joint torques in three poses</title><desc>Horizontal: shoulder 5.3955 N m, elbow 1.2753 N m. Folded: shoulder 2.8449 N m, elbow minus 1.2753 N m. Vertical: both approach zero. Values are calculated, not measured on hardware.</desc><rect width="1200" height="750" fill="#f1f5f2"/><g font-family="sans-serif" fill="#14363f"><text x="55" y="65" font-size="34">Pose changes the load and its direction</text><text x="55" y="110" font-size="21">Signed actuator holding torque. Calculated values, not hardware measurements.</text><path d="M470 160V660" stroke="#91a8a8" stroke-width="2"/><text x="450" y="700" font-size="20">Zero</text><text x="55" y="210" font-size="24">horizontal</text><rect x="470" y="175" width="431.6400000000001" height="32" rx="5" fill="#087e8b"/><text x="916.6400000000001" y="200" font-size="20">J1: 5.3955 N m</text><rect x="470" y="230" width="102.02400000000003" height="32" rx="5" fill="#bc4b16"/><text x="587.024" y="255" font-size="20">J2: 1.2753 N m</text><text x="55" y="380" font-size="24">folded</text><rect x="470" y="345" width="227.59199999999998" height="32" rx="5" fill="#087e8b"/><text x="712.592" y="370" font-size="20">J1: 2.8449 N m</text><rect x="367.976" y="400" width="102.024" height="32" rx="5" fill="#bc4b16"/><text x="485" y="425" font-size="20">J2: -1.2753 N m</text><text x="55" y="550" font-size="24">vertical</text><rect x="470" y="515" width="2" height="32" rx="5" fill="#087e8b"/><text x="485" y="540" font-size="20">J1: 0.0000 N m</text><rect x="470" y="570" width="2" height="32" rx="5" fill="#bc4b16"/><text x="485" y="595" font-size="20">J2: 0.0000 N m</text></g></svg>